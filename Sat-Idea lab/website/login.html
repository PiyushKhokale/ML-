<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBU Nagpur - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <img src="file:///C:/Users/Piyush%20Khokale/Downloads/finallogo.png" alt="RBU Logo" class="login-logo">
            <h1>Ramdeobaba University, Nagpur</h1>
            
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="signin">Sign In</button>
                <button class="tab-btn" data-tab="login">Login</button>
            </div>

            <!-- Sign In Form -->
            <form id="signin-form" class="auth-form active">
                <h2>Create Account</h2>
                <div class="form-group">
                    <label for="signin-name">Full Name</label>
                    <input type="text" id="signin-name" name="name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="signin-email">Email Address</label>
                    <input type="email" id="signin-email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="signin-password">Password</label>
                    <input type="password" id="signin-password" name="password" placeholder="Create a password" required>
                </div>
                <div class="form-group">
                    <label for="signin-confirm">Confirm Password</label>
                    <input type="password" id="signin-confirm" name="confirm" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="btn-submit">Create Account</button>
            </form>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <h2>Login to Your Account</h2>
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
                </div>
                <div class="form-group checkbox">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>
                <button type="submit" class="btn-submit">Login</button>
                <a href="#" class="forgot-password">Forgot your password?</a>
            </form>

            <div class="back-link">
                <a href="index.html">← Back to Home</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
